[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpi-rl"
version = "0.1.0"
description = "A project for reinforcement learning with MPI"
authors = [
    { name = "Yuanhao Li", email = "erwinli@qq.com" }
]
license = { text = "MIT" }

dependencies = [
    "mpi4py"
]

[tool.setuptools]
packages = ["mpi_rl"]

